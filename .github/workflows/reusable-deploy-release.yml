name: 部署不可变 Release（复用）

on:
  workflow_call:
    inputs:
      environment_name:
        description: GitHub Environment 名称
        required: true
        type: string
      release_id:
        description: 已验收的完整 40 位 commit SHA
        required: true
        type: string
      frontend_artifact:
        description: GHCR 前端 OCI Artifact 引用
        required: true
        type: string
      reset_test_data:
        description: 仅测试环境允许删除数据卷后重新部署
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  deploy:
    name: 部署到 ${{ inputs.environment_name }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}
    concurrency:
      group: deploy-${{ inputs.environment_name }}
      cancel-in-progress: false
    env:
      DEPLOY_ENV: ${{ inputs.environment_name }}
      RELEASE_ID: ${{ inputs.release_id }}
      FRONTEND_ARTIFACT: ${{ inputs.frontend_artifact }}
      SERVER_HOST: ${{ vars.DEPLOY_HOST || secrets.DEPLOY_HOST }}
      SERVER_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      SERVER_USER: ${{ vars.DEPLOY_USER || secrets.DEPLOY_USER }}
      SERVER_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      SERVER_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      APP_ROOT: ${{ vars.DEPLOY_APP_ROOT || '/srv/delivery-platform' }}
      DEPLOY_TARGET_ID: ${{ vars.DEPLOY_TARGET_ID }}
      INTERNAL_ORIGIN: ${{ vars.INTERNAL_ORIGIN }}
      PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
      RESET_TEST_DATA: ${{ inputs.reset_test_data }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_id }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: oras-project/setup-oras@v1

      - name: 校验 Environment 发布参数
        run: |
          set -Eeuo pipefail
          missing=0
          for name in SERVER_HOST SERVER_USER SERVER_SSH_KEY SERVER_KNOWN_HOSTS APP_ROOT DEPLOY_TARGET_ID INTERNAL_ORIGIN PUBLIC_ORIGIN; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required for Environment $DEPLOY_ENV"
              missing=1
            fi
          done
          [[ "$RELEASE_ID" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::RELEASE_ID is invalid'; missing=1; }
          case "$DEPLOY_ENV" in test|production) ;; *) echo '::error::Environment must be test or production'; missing=1 ;; esac
          exit "$missing"

      - name: 下载并验证前端发布物
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p release
          oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<< "$GHCR_TOKEN"
          oras pull "$FRONTEND_ARTIFACT" -o release
          node scripts/release/release-manifest.mjs verify \
            --manifest release/release-manifest.json \
            --release-id "$RELEASE_ID" \
            --frontend-file release/frontend.tar.gz

      - name: 配置固定 SSH 主机身份
        run: |
          set -Eeuo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: 检查目标服务器不可变镜像缓存
        id: image_cache
        run: |
          set -Eeuo pipefail
          backend_image="$(jq -er '.components.backend.image' release/release-manifest.json)"
          migration_image="$(jq -er '.components.migrator.image' release/release-manifest.json)"
          if ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "$SERVER_USER@$SERVER_HOST" 'bash -s' -- "$backend_image" "$migration_image" <<'REMOTE'
          set -Eeuo pipefail
          docker image inspect "$1" "$2" >/dev/null 2>&1
          REMOTE
          then
            printf 'preload=false\n' >> "$GITHUB_OUTPUT"
          else
            printf 'preload=true\n' >> "$GITHUB_OUTPUT"
          fi

      - name: 准备缺失镜像的 SSH 传输包
        if: ${{ steps.image_cache.outputs.preload == 'true' }}
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          backend_image="$(jq -er '.components.backend.image' release/release-manifest.json)"
          migration_image="$(jq -er '.components.migrator.image' release/release-manifest.json)"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          timeout --foreground 20m docker pull "$backend_image"
          timeout --foreground 20m docker pull "$migration_image"
          backend_id="$(docker image inspect "$backend_image" --format '{{.Id}}')"
          migration_id="$(docker image inspect "$migration_image" --format '{{.Id}}')"
          [[ "$backend_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$migration_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          backend_transfer_tag="delivery-platform-relay/backend:${RELEASE_ID}"
          migration_transfer_tag="delivery-platform-relay/migrator:${RELEASE_ID}"
          docker image tag "$backend_image" "$backend_transfer_tag"
          docker image tag "$migration_image" "$migration_transfer_tag"
          jq -n \
            --arg backendSource "$backend_image" \
            --arg backendTransferTag "$backend_transfer_tag" \
            --arg backendId "$backend_id" \
            --arg migratorSource "$migration_image" \
            --arg migratorTransferTag "$migration_transfer_tag" \
            --arg migratorId "$migration_id" \
            '{
              schemaVersion: 1,
              images: {
                backend: {
                  source: $backendSource,
                  transferTag: $backendTransferTag,
                  imageId: $backendId
                },
                migrator: {
                  source: $migratorSource,
                  transferTag: $migratorTransferTag,
                  imageId: $migratorId
                }
              }
            }' > release/image-bundle.map.json
          jq -e '.schemaVersion == 1 and (.images | keys == ["backend", "migrator"])' \
            release/image-bundle.map.json >/dev/null
          docker save "$backend_transfer_tag" "$migration_transfer_tag" | \
            gzip -9 > release/application-images.tar.gz
          gzip -t release/application-images.tar.gz
          sha256sum release/application-images.tar.gz | awk '{print $1}' > release/image-bundle.sha256
          stat -c '%s' release/application-images.tar.gz > release/image-bundle.bytes
          split -b 32M -d -a 4 release/application-images.tar.gz release/image-bundle.part-
          test -s release/image-bundle.part-0000
          bundle_bytes="$(cat release/image-bundle.bytes)"
          bundle_parts="$(find release -maxdepth 1 -type f -name 'image-bundle.part-*' | wc -l)"
          printf 'image bundle: %s bytes, %s parts\n' "$bundle_bytes" "$bundle_parts"
          rm -f -- release/application-images.tar.gz

      - name: 创建短期镜像中继制品
        id: image_relay_artifact
        if: ${{ steps.image_cache.outputs.preload == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: image-relay-${{ github.run_id }}-${{ inputs.environment_name }}
          path: |
            release/image-bundle.sha256
            release/image-bundle.bytes
            release/image-bundle.map.json
            release/image-bundle.part-*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: 临时授权目标服务器读取 GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "$SERVER_USER@$SERVER_HOST" \
            "docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin"

      - name: 上传发布控制文件
        run: |
          set -Eeuo pipefail
          remote_stage="/tmp/delivery-release-${RELEASE_ID}-${GITHUB_RUN_ID}"
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "$SERVER_USER@$SERVER_HOST" "install -d -m 700 '$remote_stage'"
          scp -i ~/.ssh/deploy_key -P "$SERVER_PORT" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            release/frontend.tar.gz release/release-manifest.json \
            deploy/compose/app.yml deploy/compose/data.yml \
            scripts/release/deploy-release.sh scripts/release/restore-release.sh \
            "$SERVER_USER@$SERVER_HOST:$remote_stage/"
          printf 'REMOTE_STAGE=%s\n' "$remote_stage" >> "$GITHUB_ENV"

      - name: 通过短期 HTTPS 中继下载缺失镜像
        id: image_relay_download
        if: >-
          steps.image_cache.outputs.preload == 'true' &&
          steps.image_relay_artifact.outcome == 'success'
        continue-on-error: true
        env:
          ARTIFACT_ID: ${{ steps.image_relay_artifact.outputs.artifact-id }}
          ACTIONS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          headers_file='release/image-relay-headers'
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            --connect-timeout 30 --max-time 120 \
            -D "$headers_file" -o /dev/null \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $ACTIONS_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip"
          signed_url="$(awk 'BEGIN { IGNORECASE=1 } /^location:/ {
            sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit
          }' "$headers_file")"
          rm -f -- "$headers_file"
          [[ "$signed_url" =~ ^https://[A-Za-z0-9.-]+\.blob\.core\.windows\.net/ ]]
          signed_url_base64="$(printf '%s' "$signed_url" | base64 -w0)"
          unset signed_url

          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "$SERVER_USER@$SERVER_HOST" 'bash -s' -- \
            "$REMOTE_STAGE" "$RELEASE_ID" "$signed_url_base64" <<'REMOTE'
          set -Eeuo pipefail
          stage="$1"
          release_id="$2"
          signed_url_base64="$3"
          [[ "$stage" == "/tmp/delivery-release-${release_id}-"* ]]
          [[ "$signed_url_base64" =~ ^[A-Za-z0-9+/=]+$ ]]
          test -d "$stage" && test ! -L "$stage"
          signed_url="$(printf '%s' "$signed_url_base64" | base64 -d)"
          unset signed_url_base64
          [[ "$signed_url" =~ ^https://[A-Za-z0-9.-]+\.blob\.core\.windows\.net/ ]]
          artifact_zip="$stage/.upload-image-relay.zip"
          extract_dir="$stage/.image-relay-extract"
          rm -rf -- "$extract_dir"
          install -d -m 700 "$extract_dir"
          curl --proto '=https' --tlsv1.2 --location --fail --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 5 \
            --connect-timeout 30 --max-time 3600 \
            -o "$artifact_zip" "$signed_url"
          unset signed_url
          test -s "$artifact_zip" && test ! -L "$artifact_zip"
          python3 - "$artifact_zip" "$extract_dir" <<'PY'
          import re
          import sys
          import zipfile
          from pathlib import Path

          archive = Path(sys.argv[1])
          destination = Path(sys.argv[2])
          allowed = re.compile(r'image-bundle\.(?:sha256|bytes|map\.json|part-[0-9]{4})')
          with zipfile.ZipFile(archive) as artifact:
              members = artifact.infolist()
              names = [member.filename for member in members]
              if not members or any(not allowed.fullmatch(name) for name in names):
                  raise SystemExit('image relay contains an unexpected path')
              if len(names) != len(set(names)):
                  raise SystemExit('image relay contains duplicate paths')
              required = {
                  'image-bundle.sha256',
                  'image-bundle.bytes',
                  'image-bundle.map.json',
                  'image-bundle.part-0000',
              }
              if not required.issubset(names):
                  raise SystemExit('image relay is incomplete')
              artifact.extractall(destination)
          PY
          for source in "$extract_dir"/image-bundle.*; do
            test -f "$source" && test ! -L "$source"
            name="$(basename -- "$source")"
            [[ "$name" =~ ^image-bundle\.(sha256|bytes|map\.json|part-[0-9]{4})$ ]]
            mv -f -- "$source" "$stage/$name"
          done
          rm -rf -- "$extract_dir"
          rm -f -- "$artifact_zip"
          printf 'HTTPS image relay download complete\n'
          REMOTE

      - name: 通过 SSH 分片回退上传缺失镜像
        if: >-
          steps.image_cache.outputs.preload == 'true' &&
          steps.image_relay_download.outcome != 'success'
        run: |
          set -Eeuo pipefail
          upload_one() {
            local source="$1" name attempt
            name="$(basename -- "$source")"
            [[ "$name" =~ ^image-bundle\.(sha256|bytes|map\.json|part-[0-9]{4})$ ]]
            printf 'upload start: %s\n' "$name"
            for attempt in 1 2 3; do
              if scp -i ~/.ssh/deploy_key -P "$SERVER_PORT" \
                -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
                -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
                "$source" "$SERVER_USER@$SERVER_HOST:$REMOTE_STAGE/.upload-$name" && \
                ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" \
                  -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
                  -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
                  "$SERVER_USER@$SERVER_HOST" 'bash -s' -- "$REMOTE_STAGE" "$RELEASE_ID" "$name" <<'REMOTE'
          set -Eeuo pipefail
          stage="$1"
          release_id="$2"
          name="$3"
          [[ "$stage" == "/tmp/delivery-release-${release_id}-"* ]]
          [[ "$name" =~ ^image-bundle\.(sha256|bytes|map\.json|part-[0-9]{4})$ ]]
          test -d "$stage" && test ! -L "$stage"
          test -f "$stage/.upload-$name" && test ! -L "$stage/.upload-$name"
          mv -f -- "$stage/.upload-$name" "$stage/$name"
          REMOTE
              then
                printf 'upload complete: %s\n' "$name"
                return 0
              fi
              sleep $((attempt * 5))
            done
            printf '::error::SSH image bundle upload failed: %s\n' "$name" >&2
            return 1
          }

          upload_one release/image-bundle.sha256
          upload_one release/image-bundle.bytes
          upload_one release/image-bundle.map.json
          mapfile -t image_parts < <(find release -maxdepth 1 -type f \
            -name 'image-bundle.part-*' -print | sort)
          ((${#image_parts[@]} > 0))
          printf 'uploading %s image parts with concurrency 4\n' "${#image_parts[@]}"
          for ((offset = 0; offset < ${#image_parts[@]}; offset += 4)); do
            pids=()
            for part in "${image_parts[@]:offset:4}"; do
              upload_one "$part" &
              pids+=("$!")
            done
            upload_failed=0
            for pid in "${pids[@]}"; do
              if ! wait "$pid"; then
                upload_failed=1
              fi
            done
            ((upload_failed == 0)) || exit 1
          done

      - name: 执行服务器原地切换
        env:
          PRELOAD_IMAGE_BUNDLE: ${{ steps.image_cache.outputs.preload }}
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "$SERVER_USER@$SERVER_HOST" \
            'bash -c '\''script="$(cat)"; exec bash -c "$script" "$@"'\'' buffer' -- \
            "$APP_ROOT" "$REMOTE_STAGE" "$DEPLOY_ENV" "$DEPLOY_TARGET_ID" \
            "$INTERNAL_ORIGIN" "$PUBLIC_ORIGIN" "$RESET_TEST_DATA" "$PRELOAD_IMAGE_BUNDLE" <<'REMOTE'
          set -Eeuo pipefail
          APP_ROOT="$1"
          REMOTE_STAGE="$2"
          DEPLOY_ENV="$3"
          DEPLOY_TARGET_ID="$4"
          INTERNAL_ORIGIN="$5"
          PUBLIC_ORIGIN="$6"
          RESET_TEST_DATA="$7"
          PRELOAD_IMAGE_BUNDLE="$8"

          test -d "$APP_ROOT" && test ! -L "$APP_ROOT"
          test -f "$APP_ROOT/state/target-id" && test ! -L "$APP_ROOT/state/target-id"
          test "$(tr -d '\r\n' < "$APP_ROOT/state/target-id")" = "$DEPLOY_TARGET_ID"
          test -d "$REMOTE_STAGE" && test ! -L "$REMOTE_STAGE"
          install -d -m 700 "$APP_ROOT/control" "$APP_ROOT/incoming"
          install -m 600 "$REMOTE_STAGE/app.yml" "$APP_ROOT/control/app.yml"
          install -m 600 "$REMOTE_STAGE/data.yml" "$APP_ROOT/control/data.yml"
          install -m 700 "$REMOTE_STAGE/deploy-release.sh" "$APP_ROOT/control/deploy-release.sh"
          install -m 700 "$REMOTE_STAGE/restore-release.sh" "$APP_ROOT/control/restore-release.sh"
          install -m 600 "$REMOTE_STAGE/frontend.tar.gz" "$APP_ROOT/incoming/frontend.tar.gz"
          install -m 600 "$REMOTE_STAGE/release-manifest.json" "$APP_ROOT/incoming/release-manifest.json"
          manifest_release_id="$(jq -er '.releaseId' "$APP_ROOT/incoming/release-manifest.json")"
          [[ "$manifest_release_id" =~ ^[0-9a-f]{40}$ ]]

          case "$PRELOAD_IMAGE_BUNDLE" in
            true)
              expected_sha="$(tr -d '\r\n' < "$REMOTE_STAGE/image-bundle.sha256")"
              expected_bytes="$(tr -d '\r\n' < "$REMOTE_STAGE/image-bundle.bytes")"
              bundle_map="$REMOTE_STAGE/image-bundle.map.json"
              [[ "$expected_sha" =~ ^[0-9a-f]{64}$ ]]
              [[ "$expected_bytes" =~ ^[1-9][0-9]*$ ]]
              test -f "$bundle_map" && test ! -L "$bundle_map"
              test "$(jq -er '.schemaVersion' "$bundle_map")" = 1
              test "$(jq -er '.images | keys | join(",")' "$bundle_map")" = 'backend,migrator'
              mapfile -t image_parts < <(
                find "$REMOTE_STAGE" -maxdepth 1 -type f -name 'image-bundle.part-*' \
                  -printf '%f\n' | sort
              )
              test "${#image_parts[@]}" -gt 0
              image_bundle="$APP_ROOT/incoming/application-images.tar.gz"
              image_bundle_part="$image_bundle.part"
              trap 'rm -f -- "$image_bundle_part" "$image_bundle"' EXIT
              : > "$image_bundle_part"
              for part in "${image_parts[@]}"; do
                [[ "$part" =~ ^image-bundle\.part-[0-9]{4}$ ]]
                test -f "$REMOTE_STAGE/$part" && test ! -L "$REMOTE_STAGE/$part"
                cat -- "$REMOTE_STAGE/$part" >> "$image_bundle_part"
              done
              test "$(stat -c '%s' "$image_bundle_part")" = "$expected_bytes"
              test "$(sha256sum "$image_bundle_part" | awk '{print $1}')" = "$expected_sha"
              gzip -t "$image_bundle_part"
              mv -f -- "$image_bundle_part" "$image_bundle"
              gzip -dc "$image_bundle" | docker load

              backend_image="$(jq -er '.components.backend.image' "$APP_ROOT/incoming/release-manifest.json")"
              migration_image="$(jq -er '.components.migrator.image' "$APP_ROOT/incoming/release-manifest.json")"
              backend_source="$(jq -er '.images.backend.source' "$bundle_map")"
              migration_source="$(jq -er '.images.migrator.source' "$bundle_map")"
              backend_transfer_tag="$(jq -er '.images.backend.transferTag' "$bundle_map")"
              migration_transfer_tag="$(jq -er '.images.migrator.transferTag' "$bundle_map")"
              backend_id="$(jq -er '.images.backend.imageId' "$bundle_map")"
              migration_id="$(jq -er '.images.migrator.imageId' "$bundle_map")"
              test "$backend_source" = "$backend_image"
              test "$migration_source" = "$migration_image"
              test "$backend_transfer_tag" = "delivery-platform-relay/backend:${manifest_release_id}"
              test "$migration_transfer_tag" = "delivery-platform-relay/migrator:${manifest_release_id}"
              [[ "$backend_id" =~ ^sha256:[0-9a-f]{64}$ ]]
              [[ "$migration_id" =~ ^sha256:[0-9a-f]{64}$ ]]
              test "$(docker image inspect "$backend_transfer_tag" --format '{{.Id}}')" = "$backend_id"
              test "$(docker image inspect "$migration_transfer_tag" --format '{{.Id}}')" = "$migration_id"

              images=("$backend_image" "$migration_image")
              image_ids=("$backend_id" "$migration_id")
              for index in "${!images[@]}"; do
                image="${images[$index]}"
                expected_id="${image_ids[$index]}"
                pulled='false'
                for attempt in 1 2; do
                  if timeout --foreground 2m docker pull "$image"; then
                    pulled='true'
                    break
                  fi
                  sleep $((attempt * 5))
                done
                test "$pulled" = true
                test "$(docker image inspect "$image" --format '{{.Id}}')" = "$expected_id"
              done
              docker image rm "$backend_transfer_tag" "$migration_transfer_tag" >/dev/null 2>&1 || true
              rm -f -- "$image_bundle"
              trap - EXIT
              printf '[release] checksummed SSH image preload completed with verified identities\n'
              ;;
            false) ;;
            *) printf '[release][error] invalid image preload state\n' >&2; exit 1 ;;
          esac

          case "$RESET_TEST_DATA" in
            true)
              test "$DEPLOY_ENV" = test
              runtime_env="$APP_ROOT/config/runtime.env"
              test -f "$runtime_env" && test ! -L "$runtime_env"
              test "$(stat -c '%a' "$runtime_env")" = 600
              reset_release_env="$APP_ROOT/incoming/.reset-release-$$.env"
              trap 'rm -f -- "$reset_release_env"' EXIT
              release_id="$(jq -er '.shortReleaseId' "$APP_ROOT/incoming/release-manifest.json")"
              backend_image="$(jq -er '.components.backend.image' "$APP_ROOT/incoming/release-manifest.json")"
              migration_image="$(jq -er '.components.migrator.image' "$APP_ROOT/incoming/release-manifest.json")"
              umask 077
              printf 'RELEASE_ID=%s\nBACKEND_IMAGE=%s\nMIGRATION_IMAGE=%s\n' \
                "$release_id" "$backend_image" "$migration_image" > "$reset_release_env"

              mapfile -t reset_volumes < <(
                docker compose --env-file "$runtime_env" -f "$APP_ROOT/control/data.yml" \
                  config --format json |
                  jq -er '.volumes | to_entries | map(.value.name) | sort | .[]'
              )
              test "${#reset_volumes[@]}" -eq 3
              for volume in "${reset_volumes[@]}"; do
                [[ "$volume" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]+$ ]]
              done

              printf '[cleanup-before] exact MySQL table counts\n'
              docker compose --env-file "$runtime_env" -f "$APP_ROOT/control/data.yml" \
                exec -T mysql sh -ec '
                  export MYSQL_PWD="$MYSQL_ROOT_PASSWORD"
                  mysql -N -uroot "$MYSQL_DATABASE" -e \
                    "SELECT TABLE_NAME FROM information_schema.TABLES WHERE TABLE_SCHEMA = DATABASE() AND TABLE_TYPE = '\''BASE TABLE'\'' ORDER BY TABLE_NAME" |
                  while IFS= read -r table; do
                    case "$table" in (*[!A-Za-z0-9_]*) exit 1;; esac
                    count="$(mysql -N -uroot "$MYSQL_DATABASE" -e "SELECT COUNT(*) FROM \`$table\`")"
                    printf "%s=%s\n" "$table" "$count"
                  done
                '
              printf '[cleanup-before] redis_keys='
              docker compose --env-file "$runtime_env" -f "$APP_ROOT/control/data.yml" \
                exec -T redis sh -ec 'REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli --no-auth-warning DBSIZE'
              printf '[cleanup-before] minio_files='
              docker compose --env-file "$runtime_env" -f "$APP_ROOT/control/data.yml" \
                run --rm --no-deps --entrypoint /bin/sh minio-init -ec '
                  mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null
                  mc ls --recursive --json "local/$MINIO_BUCKET" | wc -l
                '

              docker compose --env-file "$runtime_env" --env-file "$reset_release_env" \
                -f "$APP_ROOT/control/app.yml" down --remove-orphans </dev/null
              docker compose --env-file "$runtime_env" -f "$APP_ROOT/control/data.yml" \
                down --volumes --remove-orphans </dev/null
              for volume in "${reset_volumes[@]}"; do
                ! docker volume inspect "$volume" >/dev/null 2>&1
              done
              rm -f -- "$reset_release_env"
              trap - EXIT
              printf '[release] disposable test data volumes removed\n'
              ;;
            false) ;;
            *) printf '[release][error] invalid reset_test_data value\n' >&2; exit 1 ;;
          esac

          APP_ROOT="$APP_ROOT" \
          DEPLOY_ENV="$DEPLOY_ENV" \
          DEPLOY_TARGET_ID="$DEPLOY_TARGET_ID" \
          INTERNAL_ORIGIN="$INTERNAL_ORIGIN" \
          PUBLIC_ORIGIN="$PUBLIC_ORIGIN" \
          RESET_TEST_DATA="$RESET_TEST_DATA" \
          RELEASE_MANIFEST="$APP_ROOT/incoming/release-manifest.json" \
          FRONTEND_BUNDLE="$APP_ROOT/incoming/frontend.tar.gz" \
          bash "$APP_ROOT/control/deploy-release.sh" deploy
          rm -f -- "$APP_ROOT/incoming/frontend.tar.gz" "$APP_ROOT/incoming/release-manifest.json"
          rm -rf -- "$REMOTE_STAGE"
          REMOTE

      - name: 从外部核对目标入口发布号
        run: |
          set -Eeuo pipefail
          expected="${RELEASE_ID:0:12}"
          verified='false'
          for attempt in {1..12}; do
            actual="$(curl -fsS --connect-timeout 10 --max-time 15 -H 'Cache-Control: no-cache' \
              "${PUBLIC_ORIGIN%/}/build-info.json" 2>/dev/null | jq -r '.releaseId' 2>/dev/null || true)"
            if [ "$actual" = "$expected" ] && \
              curl -fsS --connect-timeout 10 --max-time 15 \
                "${PUBLIC_ORIGIN%/}/api/v1/ready" >/dev/null 2>&1; then
              verified='true'
              break
            fi
            sleep 5
          done
          test "$verified" = true

      - name: 清理目标服务器临时发布目录
        if: ${{ always() }}
        run: |
          set -Eeuo pipefail
          if [ -n "${REMOTE_STAGE:-}" ]; then
            ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" \
              -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=30 \
              "$SERVER_USER@$SERVER_HOST" 'bash -s' -- "$REMOTE_STAGE" "$RELEASE_ID" <<'REMOTE'
          set -Eeuo pipefail
          stage="$1"
          release_id="$2"
          [[ "$stage" == "/tmp/delivery-release-${release_id}-"* ]]
          if [ -e "$stage" ] || [ -L "$stage" ]; then
            test -d "$stage" && test ! -L "$stage"
            rm -rf -- "$stage"
          fi
          REMOTE
          fi

      - name: 清理目标服务器临时 GHCR 凭据
        if: ${{ always() }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=30 \
            "$SERVER_USER@$SERVER_HOST" 'docker logout ghcr.io'

      - name: 清理 Runner 临时 GHCR 凭据
        if: ${{ always() && steps.image_cache.outputs.preload == 'true' }}
        run: docker logout ghcr.io
