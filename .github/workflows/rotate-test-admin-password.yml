name: 轮换测试环境管理员密码

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: 测试环境当前部署的完整 40 位 main SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  rotate:
    name: 轮换并验证 test 管理员
    runs-on: ubuntu-latest
    environment: test
    concurrency:
      group: test-admin-password-rotation
      cancel-in-progress: false
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
      SERVER_HOST: ${{ vars.DEPLOY_HOST || secrets.DEPLOY_HOST }}
      SERVER_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      SERVER_USER: ${{ vars.DEPLOY_USER || secrets.DEPLOY_USER }}
      SERVER_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      SERVER_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      APP_ROOT: ${{ vars.DEPLOY_APP_ROOT || '/srv/delivery-platform' }}
      DEPLOY_TARGET_ID: ${{ vars.DEPLOY_TARGET_ID }}
      PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
      REMOTE_STAGE: /tmp/delivery-admin-access-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: 校验轮换参数
        run: |
          set -Eeuo pipefail
          missing=0
          for name in TEST_ADMIN_PASSWORD SERVER_HOST SERVER_USER SERVER_SSH_KEY SERVER_KNOWN_HOSTS APP_ROOT DEPLOY_TARGET_ID PUBLIC_ORIGIN; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required for Environment test"
              missing=1
            fi
          done
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::release_sha 必须是完整 40 位小写 SHA'; missing=1; }
          [ "${#TEST_ADMIN_PASSWORD}" -ge 20 ] && [ "${#TEST_ADMIN_PASSWORD}" -le 72 ] || {
            echo '::error::TEST_ADMIN_PASSWORD 长度必须为 20 到 72 个字符'
            missing=1
          }
          exit "$missing"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - name: 校验 Release 属于 main 历史
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse --verify --end-of-options "${RELEASE_SHA}^{commit}")" = "$RELEASE_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main

      - name: 配置固定 SSH 主机身份
        run: |
          set -Eeuo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: 上传固定提交的管理员轮换脚本
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=30 \
            "$SERVER_USER@$SERVER_HOST" "install -d -m 700 '$REMOTE_STAGE'"
          scp -i ~/.ssh/deploy_key -P "$SERVER_PORT" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=30 \
            scripts/release/rotate-test-admin-password.sh \
            "$SERVER_USER@$SERVER_HOST:$REMOTE_STAGE/rotate-test-admin-password.sh"

      - name: 轮换密码并验证登录权限
        run: |
          set -Eeuo pipefail
          printf '%s\n' "$TEST_ADMIN_PASSWORD" | ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "$SERVER_USER@$SERVER_HOST" \
            "bash '$REMOTE_STAGE/rotate-test-admin-password.sh' '$APP_ROOT' '$DEPLOY_TARGET_ID' '$RELEASE_SHA' '$PUBLIC_ORIGIN'"

      - name: 清理临时轮换文件
        if: ${{ always() }}
        run: |
          set -Eeuo pipefail
          if [ ! -f ~/.ssh/deploy_key ]; then
            exit 0
          fi
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=30 \
            "$SERVER_USER@$SERVER_HOST" 'bash -s' -- "$REMOTE_STAGE" <<'REMOTE'
          set -Eeuo pipefail
          stage="$1"
          case "$stage" in
            /tmp/delivery-admin-access-[0-9]*-[0-9]*) ;;
            *) printf 'unsafe administrator rotation stage: %s\n' "$stage" >&2; exit 1 ;;
          esac
          rm -f -- "$stage/rotate-test-admin-password.sh"
          rmdir -- "$stage" 2>/dev/null || true
          REMOTE
