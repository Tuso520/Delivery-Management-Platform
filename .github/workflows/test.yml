name: 质量检查

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  quality:
    name: 前后端质量检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
      - name: 开发环境预检
        run: node scripts/preflight.mjs
      - name: 文档事实检查
        run: node scripts/verify-doc-facts.mjs
      - name: Architecture boundary check
        run: node scripts/check-architecture-boundaries.mjs
      - name: Access control contract check
        run: node scripts/sync-access-control-contract.mjs
      - name: Prisma runtime boundary check
        run: node scripts/check-prisma-runtime-boundaries.mjs
      - name: Release contract and shell syntax checks
        run: |
          node --test scripts/release/release-manifest.test.mjs scripts/release/release-shell-contract.test.mjs scripts/release/test-runtime-acceptance-contract.test.mjs
          bash -n scripts/release/bootstrap-runtime-config.sh
          bash -n scripts/release/deploy-release.sh
          bash -n scripts/release/restore-release.sh
          sh -n deploy/nginx/dmp-nginx-control.template
      - name: 安装后端依赖
        working-directory: delivery-platform-server
        run: pnpm install --frozen-lockfile
      - name: 后端代码检查
        working-directory: delivery-platform-server
        run: pnpm lint && git diff --exit-code
      - name: 后端类型检查
        working-directory: delivery-platform-server
        run: pnpm prisma:generate && pnpm type-check
      - name: 后端测试
        working-directory: delivery-platform-server
        run: pnpm test --runInBand
      - name: 后端构建
        working-directory: delivery-platform-server
        run: pnpm build
      - name: 安装前端依赖
        working-directory: delivery-platform-web
        run: pnpm install --frozen-lockfile
      - name: 前端代码检查
        working-directory: delivery-platform-web
        run: pnpm lint && git diff --exit-code
      - name: 前端类型检查
        working-directory: delivery-platform-web
        run: pnpm type-check
      - name: 前端测试
        working-directory: delivery-platform-web
        run: pnpm test
      - name: 前端构建与体积预算
        working-directory: delivery-platform-web
        run: pnpm build && pnpm budget
      - name: Docker Compose 配置检查
        run: |
          docker compose --env-file .env.local.example -f docker-compose.test.yml config -q
          docker compose --env-file /dev/null -f deploy/compose/data.yml config -q
          docker compose --env-file /dev/null -f deploy/compose/app.yml config -q
        env:
          DATA_PROJECT_NAME: delivery-platform-ci-data-config
          APP_PROJECT_NAME: delivery-platform-ci-app-config
          DATA_NETWORK_NAME: delivery-platform-ci-data-config
          MYSQL_VOLUME_NAME: delivery-platform-ci-mysql-config
          REDIS_VOLUME_NAME: delivery-platform-ci-redis-config
          MINIO_VOLUME_NAME: delivery-platform-ci-minio-config
          MYSQL_DATABASE: delivery_platform
          MYSQL_USER: delivery_user
          MYSQL_ROOT_PASSWORD: config-only-root
          MYSQL_USER_PASSWORD: config-only-user
          REDIS_PASSWORD: config-only-redis
          MINIO_ROOT_USER: config_only_minio
          MINIO_ROOT_PASSWORD: config-only-minio
          MINIO_BUCKET: delivery-platform
          RELEASE_ID: 0123456789ab
          BACKEND_IMAGE: ghcr.io/example/delivery-platform/backend@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          MIGRATION_IMAGE: ghcr.io/example/delivery-platform/migrator@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          JWT_SECRET: config-only-jwt
          INTEGRATION_SECRET_ENCRYPTION_KEY: Y29uZmlnLW9ubHktMzItYnl0ZS1rZXktMTIzNDU2Nw==
          SEED_ADMIN_PASSWORD: config-only-admin
          SEED_DEFAULT_PASSWORD: config-only-default
          CORS_ORIGIN: https://config.invalid
