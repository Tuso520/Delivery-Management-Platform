name: Test server diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Inspect test server runtime
    runs-on: ubuntu-latest
    environment: test
    env:
      SERVER_HOST: ${{ vars.DEPLOY_HOST || secrets.DEPLOY_HOST }}
      SERVER_USER: ${{ vars.DEPLOY_USER || secrets.DEPLOY_USER }}
      SERVER_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      SERVER_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      SERVER_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      SERVER_TARGET_ID: ${{ vars.DEPLOY_TARGET_ID }}
      APP_DIR: ${{ vars.DEPLOY_APP_DIR || '/www/wwwroot/delivery-platform' }}
      COMPOSE_PROJECT_NAME: ${{ vars.DEPLOY_COMPOSE_PROJECT_NAME || 'delivery-platform-test' }}
    steps:
      - name: Validate isolated test target
        shell: bash
        run: |
          set -Eeuo pipefail
          missing=0
          for name in SERVER_HOST SERVER_USER SERVER_SSH_KEY SERVER_KNOWN_HOSTS SERVER_TARGET_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required for environment test"
              missing=1
            fi
          done
          [[ "$COMPOSE_PROJECT_NAME" == *test* || "$COMPOSE_PROJECT_NAME" == *testing* ]] || {
            echo "::error::COMPOSE_PROJECT_NAME must identify an isolated test project"
            missing=1
          }
          exit "$missing"

      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Read test runtime diagnostics
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/deploy_key -p "$SERVER_PORT" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=30 \
            "$SERVER_USER@$SERVER_HOST" 'bash -s' -- \
            "$APP_DIR" "$SERVER_TARGET_ID" "$COMPOSE_PROJECT_NAME" <<'REMOTE'
          set -Eeuo pipefail
          APP_DIR="$1"
          EXPECTED_TARGET_ID="$2"
          COMPOSE_PROJECT_NAME="$3"

          test -f "$APP_DIR/.deploy/target-id"
          test ! -L "$APP_DIR/.deploy/target-id"
          test "$(cat "$APP_DIR/.deploy/target-id")" = "$EXPECTED_TARGET_ID"
          cd "$APP_DIR"

          echo "== host =="
          uptime
          free -h
          df -h /

          echo "== containers =="
          docker ps -a \
            --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME" \
            --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'

          echo "== runtime state =="
          mapfile -t containers < <(
            docker ps -aq --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME"
          )
          for id in "${containers[@]}"; do
            docker inspect "$id" --format \
              '{{.Name}} status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} restart={{.RestartCount}} oom={{.State.OOMKilled}} exit={{.State.ExitCode}} error={{json .State.Error}}'
          done

          echo "== backend log tail =="
          docker logs --timestamps --tail 200 delivery-backend 2>&1 || true

          echo "== frontend log tail =="
          docker logs --timestamps --tail 100 delivery-frontend 2>&1 || true

          echo "== mysql log tail =="
          docker logs --timestamps --tail 100 delivery-mysql 2>&1 || true
          REMOTE
